<!DOCTYPE html>
<html lang="en">
<!-- some metadata for the browser -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <!-- this creates the 400x400 grid canvas where the game is drawn -->
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    
    <!-- a paragraph (now empty) to display information (score or game) over messages -->
    <p id="info"></p>


    <!-- a restart button -->
    <p id="info"></p>
    <button id="restartBtn" style="display: none; padding: 8px 16px; font-size: 16px; cursor: pointer;">Restart Game</button>

    
    <script>
        // ===== GAME SETUP =====
        // the canvas & the cts select the html canvas element and gets it 2D rendering context
        // it is used to draw shapes
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        // this divides the screen into 20x20 pixel tiles
        const gridSize = 20;
        // the board is 20 tiles wide and 20 tiles high so 400/20 = 20 and the count is 20
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE VARIABLES =====
        // Step 3: Eating and growing
        // first create a function that generates the food at random coordinates inside the grid
        const generateFood = () => {
            return {
                x: Math.floor(Math.random() * 20),
                y: Math.floor(Math.random() * 20)
            };
        };
        
        
        // this makes an array of coordinate objects. They represent the segments
        // Segment 0 so x:10, y:10 is the head
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        // this means it moves right - one unit on the x axis per tick but 0 on y axis
        let direction = { x: 1, y: 0 };
        // current position of the apple on the grid - which is just for the step 1 and 2 now at step 3 it should be generated ranodm
        //let food = { x: 15, y: 15 };
        // it starts at 0
        //let score = 0;

        // the food positon and the score need to be initialized 
        let food = generateFood();
        let score = 0;

        // ===== DRAWING FUNCTION =====
        const drawGame = () => {
            // first you want to erase the entire board before drawing a new frame
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            // this multiplies the grid coordinates by the gridSize to render squares for food and snake segments
            // so for example tile 10 becomes pixel 200
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };
        // this is executed once when the page loads
        // it renders the static snapshot
        drawGame();


        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //

        // this function stops the loop with the clearInterval and then displays a text that the game is over and displays the final score
        const handleGameOver = () => {
            clearInterval(gameInterval);
            document.getElementById("info").innerText = `Game Over! Final Score: ${score}.`;
            // the reset button should be displayed when the game is over
            document.getElementById("restartBtn").style.display = "inline-block";
        };

        // if you then press the space button on your keyboard you restart the game
        // this means that the snake is set to a certain point, the direction is set new, the score is 0 again and the food needs to be generated.
        const resetGame = () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            score = 0;
            food = generateFood();
            document.getElementById("info").innerText = "";

            // the reset button needs to be hidden again when the game starts
            document.getElementById("restartBtn").style.display = "none";

            // the game loop is started again
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 150);
        };


        // Step 1: Movement (game loop)
        const moveSnake = () => {
            // the head is the first element in the array so snake[0]
            // then calculate the new head position and create a new object
            // if the head was at x: 5 and is moving right (so the direction.x = 1), the head will be at x: 6
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            // for step 4 there needs to be a check for a wall collision
            // it checks if it is out of the grid so smaller then 0 or bigger then the titleCount
            const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
            
            // it is also possible that the snake hits itselfe - thats when the snakes head touches the end of it
            const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);

            // if either of those boolean variables are true then the game is over and the handleGameOver() function needs to be called
            if (hitWall || hitSelf){
                handleGameOver();
                return;
            }

            // with .unshift(head) the new head is added to the front
            snake.unshift(head);
            // THIS IS WORKING FOR STEP 1 AND 2:
            // with .pop() the last tail segment is removed
            //snake.pop();
            // this way the snake keeps the same length

            // FOR STEP 3 moveSnake MUST BE UPDATED BECAUSE THE SNAKE SHOULD GROW:
            // the function needs to check if the new head position matches the food position 
            if (head.x === food.x && head.y === food.y){
                // if so then the snake ate the food so the score needs to go up by 1
                score += 1;
                // and a new food position must be generated
                // the snake.pop() is not called here and thats why the snake grows 
                food = generateFood();
            }
            // if the snake did not eat any foot the tail must be removed so it stays the same length
            else {
                snake.pop();
            }

        }

        // that the snake really moves foreward on the screen the functions need to be called every 150 ms
        // it is important to call the drawGame because the array would change internally but the webpage would continue displaying the old frame
        const gameLoop = () => {
            moveSnake();
            drawGame();
        };
        
        // for step 4 make a variable
        let gameInterval

        // so the function gameLoop (which contains the moveSnake and drawGame function) is called every 150 ms
        setInterval(gameLoop, 150);

        document.getElementById("restartBtn").addEventListener("click", () => {
            resetGame();
        });


        // Step 2: Keyboard controls (arrow keys)
        // the program needs to keep track of the keyboard and which key is pressed. This works the best with an EventListener
        // he should listen to the entire webpage (thats the document for)and it is triggered when a key is pressed down (keydown - the other option would be keyup)
        // the event is an object that is automatically created by the browser. He holds the metadata about the key press such as event.key
        document.addEventListener("keydown", (event) => {
            // this checks if the key pressed was the Up Arrow and that the snake is not currently moving down
            // if boths true then the direction is updated
            if (event.key === "ArrowUp" && direction.y !== 1){
                direction = {x: 0, y: -1};
            }
            // this checks if the key pressed was Down Arrow and the snake is not currently moving up
            // if boths true then the direction is updated
            else if (event.key === "ArrowDown" && direction.y !== 1){
                direction = {x: 0, y: 1};
            } 
            // this checks if the key pressed was the Lef Arrow and the snake is not moving right
            // if boths true then the drection is updated
            else if (event.key === "ArrowLeft" && direction.x !== 1){
                direction = {x: -1, y: 0};
            }
            // checks if the key pressed down was Right Arrow and the snake is not moving left
            // if boths true the direction is updated
            else if (event.key === "ArrowRight" && direction.x !== -1){
                direction = {x: 1, y: 0};
            }
        })


        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>
let gameInterval = setInterval(gameLoop, 150);
</body>
</html>
